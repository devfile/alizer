on:
  push:
    tags:
      - "v*"

name: Build Release

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        goosarch:
          - "darwin/amd64"
          - "darwin/arm64"
          - "linux/amd64"
          - "linux/arm64"
          - "linux/ppc64le"
          - "linux/s390x"
          - "windows/amd64"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: Get OS and arch info
        run: |
          GOOSARCH=${{matrix.goosarch}}
          GOOS=${GOOSARCH%/*}
          GOARCH=${GOOSARCH#*/}
          RELEASE_VERSION=${GITHUB_REF#refs/*/}
          if [ "$GOOS" == "windows" ]
          then
            BINARY_NAME=alizer-$RELEASE_VERSION-$GOOS-$GOARCH.exe
          else
            BINARY_NAME=alizer-$RELEASE_VERSION-$GOOS-$GOARCH
          fi
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV
          echo "HASHFILE_NAME=$BINARY_NAME.sha256" >> $GITHUB_ENV
          echo "GOOS=$GOOS" >> $GITHUB_ENV
          echo "GOARCH=$GOARCH" >> $GITHUB_ENV
      - name: Build
        run: |
          go build -o ${{env.BINARY_NAME}} -v
      - name: Generate sha256 checksum
        uses: jmgilman/actions-generate-checksum@3ea6dc9bf8eecf28e2ecc982fab683484a1a8561 # v1.0.1
        with:
          output: ${{env.HASHFILE_NAME}}
          method: sha256
          patterns: ${{env.BINARY_NAME}}
      - name: Release with Notes and Binaries
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          files: |
            ${{env.BINARY_NAME}}
            ${{env.HASHFILE_NAME}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
