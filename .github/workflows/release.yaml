on:
  push:
    tags:
      - "v*"

name: Build Release

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        goosarch:
          - "darwin/amd64"
          - "darwin/arm64"
          - "linux/amd64"
          - "linux/arm64"
          - "linux/ppc64le"
          - "linux/s390x"
          - "windows/amd64"
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
        with:
          go-version-file: "go.mod"
      - name: Get OS and arch info
        run: |
          GOOSARCH=${{matrix.goosarch}}
          GOOS=${GOOSARCH%/*}
          GOARCH=${GOOSARCH#*/}
          RELEASE_VERSION=${GITHUB_REF#refs/*/}
          if [ "$GOOS" == "windows" ]
          then
            BINARY_NAME=alizer-$RELEASE_VERSION-$GOOS-$GOARCH.exe
          else
            BINARY_NAME=alizer-$RELEASE_VERSION-$GOOS-$GOARCH
          fi
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV
          echo "HASHFILE_NAME=$BINARY_NAME.sha256" >> $GITHUB_ENV
          echo "GOOS=$GOOS" >> $GITHUB_ENV
          echo "GOARCH=$GOARCH" >> $GITHUB_ENV
      - name: Build
        run: |
          go build -o ${{env.BINARY_NAME}} -v
      - name: Generate sha256 checksum
        uses: jmgilman/actions-generate-checksum@3ea6dc9bf8eecf28e2ecc982fab683484a1a8561 # v1.0.1
        with:
          output: ${{env.HASHFILE_NAME}}
          method: sha256
          patterns: ${{env.BINARY_NAME}}
      - name: Release with Notes and Binaries
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v0.1.15
        with:
          draft: false
          files: |
            ${{env.BINARY_NAME}}
            ${{env.HASHFILE_NAME}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
